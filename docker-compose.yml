services:
  eventsim:
    build:
      context: eventsim/.
      dockerfile: Dockerfile
    image: eventsim:2.0
    container_name: eventsim
    depends_on:
      - kafka
    volumes:
      # Map thư mục output từ container ra máy host để lấy dữ liệu profile
      - ./data:/opt/eventsim/output_data
    # Cấu hình sinh dữ liệu mẫu ra thư mục output_data
    command:
      - "-c"
      - "examples/config.json"
      - "--start-time"
      - "2026-09-01T00:00:00"
      - "-n"
      - "100"
      - "--growth-rate"
      - "0"
      - "--userid"
      - "1"
      - "--randomseed"
      - "1"
      - "--continuous"
      - "--kafkaBrokerList"
      - "kafka:9092"

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data

volumes:
  kafka-data: