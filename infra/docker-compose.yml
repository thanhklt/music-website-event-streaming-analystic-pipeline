name: "eventsim-streaming-pipeline"

x-kafka: &kafka
  image: apache/kafka:4.3.1
  environment: &kafka-environment
    CLUSTER_ID: "event-sim-cluster" # Định danh cluster cho các broker
    KAFKA_LISTENERS: "INTERNAL://:9092,EXTERNAL://:9093,CONTROLLER://:9094,DOCKER_COMPOSE://:9095" # Mở cổng <tên_listener>://:<port>
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,DOCKER_COMPOSE:PLAINTEXT" # Khai báo giao thức cho listener 
    KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
    KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
    KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9094,2@kafka-2:9094,3@kafka-3:9094" # quorum: bầu để chọn 1 active controller. node_id@host:port
    KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    KAFKA_DEFAULT_REPLICATION_FACTOR: "2"
    KAFKA_NUM_PARTITIONS: "2"
    KAFKA_MIN_INSYNC_REPLICAS: "2" # Số partition tối thiểu của topic để cháp nhận ghi
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "2" # Số bản sao (replica) của topic __consumer_offsets
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "2"
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    # SASL Config
    KAFKA_SASL_ENABLED_MECHANISMS: "PLAIN"
    KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/secrets/kafka_server_jaas.conf"

  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 12
    start_period: 30s
  networks:
    - eventsim-net

services:
  kafka-1:
    <<: *kafka
    container_name: kafka-1
    hostname: kafka-1
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - kafka-1-data:/var/lib/kafka/data
      - ./kafka/kafka_server_jaas.conf:/etc/kafka/secrets/kafka_server_jaas.conf:ro
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "controller, broker"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-1:9092,EXTERNAL://127.0.0.1:9093,DOCKER_COMPOSE://kafka-1:9095" # Cổng bên ngoài để kết nối

  kafka-2:
    <<: *kafka
    container_name: kafka-2
    hostname: kafka-2
    ports:
      - "127.0.0.1:19093:9093"
    volumes:
      - kafka-2-data:/var/lib/kafka/data
      - ./kafka/kafka_server_jaas.conf:/etc/kafka/secrets/kafka_server_jaas.conf:ro
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: "2"
      KAFKA_PROCESS_ROLES: "controller, broker"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-2:9092,EXTERNAL://127.0.0.1:19093,DOCKER_COMPOSE://kafka-2:9095"

  kafka-3:
    <<: *kafka
    container_name: kafka-3
    hostname: kafka-3
    ports:
      - "127.0.0.1:29093:9093"
    volumes:
      - kafka-3-data:/var/lib/kafka/data
      - ./kafka/kafka_server_jaas.conf:/etc/kafka/secrets/kafka_server_jaas.conf:ro
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: "3"
      KAFKA_PROCESS_ROLES: "controller, broker"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-3:9092,EXTERNAL://127.0.0.1:29093,DOCKER_COMPOSE://kafka-3:9095"
  
  akhq:
    image: 'tchiotludo/akhq:0.24.0'
    networks:
      - eventsim-net
    container_name: akhq
    ports:
      - '8180:8080'
    environment:
      # akhq-username: admin
      # akhq-password: admin-akhq

      # kafka-username: admin-02
      # kafka-password: admin-02
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            kafka-server:
              properties:
                bootstrap.servers: "kafka-1:9095,kafka-2:9095,kafka-3:9095"
                security.protocol: PLAINTEXT
                sasl.mechanism: PLAIN
                sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="admin-02" password="admin-02";
          security:
            default-group: no-roles
            basic-auth:
              - username: admin-akhq
                password: b95c7c362a3def927421de531f420e10520f785e42c72523e45117e4a05de7a5
                passwordHash: SHA256
                groups:
                - admin
        micronaut:
            security:
              enabled: true
              token:
                jwt:
                  signatures:
                    secret:
                      generator:
                        secret: "6661a0975cd371c713f66a94bcd51ec874e0b040aec61f025964ad5fe7ee3120"

  hdfs-init:
    image: apache/hadoop:3.3.6
    user: "0" # Lấy user root cấp quyền cho hadoop
    network_mode: none
    volumes:
      - namenode-data:/opt/hadoop/dfs/name
      - datanode-data:/opt/hadoop/dfs/data
    command:
      - bash
      - -ec
      - |
        # Only initialize ownership of the volume roots; preserve existing contents.
        chown "$$(id -u hadoop):$$(id -g hadoop)" /opt/hadoop/dfs/name /opt/hadoop/dfs/data

  namenode:
    image: apache/hadoop:3.3.6
    container_name: namenode
    hostname: namenode
    depends_on:
      hdfs-init:
        condition: service_completed_successfully
    ports:
      - "9000:9000"   # HDFS RPC
      - "9870:9870"   # NameNode Web UI & WebHDFS
    volumes:
      - namenode-data:/opt/hadoop/dfs/name
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    environment:
      HADOOP_HOME: /opt/hadoop
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
    command:
      - bash
      - -ec
      - |
        if [ ! -f /opt/hadoop/dfs/name/current/VERSION ]; then
          if [ -n "$$(ls -A /opt/hadoop/dfs/name)" ]; then
            echo 'Refusing to format non-empty NameNode storage without VERSION' >&2
            exit 1
          fi
          /opt/hadoop/bin/hdfs namenode -format -nonInteractive
        fi
        exec /opt/hadoop/bin/hdfs namenode
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9870 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - eventsim-net

  datanode:
    image: apache/hadoop:3.3.6
    container_name: datanode
    hostname: datanode
    depends_on:
      hdfs-init:
        condition: service_completed_successfully
      namenode:
        condition: service_healthy
    ports:
      - "9864:9864"   # DataNode Web UI
      - "9866:9866"   # DataNode Data transfer
    volumes:
      - datanode-data:/opt/hadoop/dfs/data
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    environment:
      HADOOP_HOME: /opt/hadoop
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
    command: >
      bash -c "/opt/hadoop/bin/hdfs datanode"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9864 >/dev/null && /opt/hadoop/bin/hdfs dfsadmin -report | grep -q 'Live datanodes (1)'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - eventsim-net

  duckdb:
    image: duckdb/duckdb:latest
    container_name: duckdb_analytics
    volumes:
      - ./duckdb/data:/workspace
      - ./duckdb/init.sql:/init.sql:ro
      - duckdb-data:/root/.duckdb
    working_dir: /workspace
    entrypoint: ["duckdb"]
    command:
      - "-cmd"
      - ".read /init.sql"
      - "warehouse.duckdb"
    restart: unless-stopped
    stdin_open: true # Giữ terminal mở để tương tác CLI nếu cần
    tty: true
    networks:
      - eventsim-net

networks:
  eventsim-net:
    name: eventsim-net
    driver: bridge

volumes:
  kafka-1-data:
    name: eventsim-kafka-v2-1-data
  kafka-2-data:
    name: eventsim-kafka-v2-2-data
  kafka-3-data:
    name: eventsim-kafka-v2-3-data
  namenode-data:
    name: eventsim-hdfs-v2-name
  datanode-data:
    name: eventsim-hdfs-v2-data
  hue-data:
    name: hue-data
  duckdb-data:
    name: duckdb-data
