- name: fact_song_play
  description: One row per source play_key; incremental insert/update, six FK defaults, other source values unchanged. No
    automatic source deletes.
  columns:
  - name: play_key
    description: Preserved verbatim from intermediate, including NULL.
    data_tests:
    - not_null
    - unique
  - name: user_id
    description: Preserved verbatim from intermediate, including NULL.
  - name: session_id
    description: Preserved verbatim from intermediate, including NULL.
  - name: item_in_session
    description: Preserved verbatim from intermediate, including NULL.
  - name: user_key
    description: Foreign key to dim_user; NULL maps to '-1'.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_user')
          field: user_key
  - name: song_key
    description: Foreign key to dim_song; NULL maps to '-1'.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_song')
          field: song_key
  - name: session_key
