    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_session')
          field: session_key
  - name: location_key
    description: Foreign key to dim_location; NULL maps to '-1'.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_location')
          field: location_key
  - name: play_date_key
    description: Foreign key to dim_date; NULL maps to DATE '1970-01-01'.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_date')
          field: date_key
  - name: play_time_key
    description: Foreign key to dim_time; NULL maps to -1.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_time')
          field: time_key
  - name: play_started_at
    description: Preserved verbatim from intermediate, including NULL.
  - name: play_ended_at
    description: Preserved verbatim from intermediate, including NULL.
  - name: listened_seconds
    description: Preserved verbatim from intermediate, including NULL.
